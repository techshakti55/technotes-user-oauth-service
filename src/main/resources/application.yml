spring:
  application:
    name: technotes-user-oauth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/technotes_user_oauth_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 9000
